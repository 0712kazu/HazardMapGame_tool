name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu
      QGIS_IMAGE_TAG: 3.44.15
    steps:
      - uses: actions/checkout@v5

      - name: Pull QGIS 3.44.15 LTR
        run: docker pull qgis/qgis:${{ env.QGIS_IMAGE_TAG }}

      - name: Run tests on QGIS 3.44.15
        run: >
          docker run --rm --volume `pwd`:/app -w=/app qgis/qgis:${{ env.QGIS_IMAGE_TAG }} sh -c
          "python3 -m venv --system-site-packages /tmp/hmg-test-venv &&
          /tmp/hmg-test-venv/bin/pip install
          pytest==9.2.0 pytest-qgis==5.0.2 pytest-cov==7.1.0 &&
          PYTHONPATH=/app xvfb-run -s '+extension GLX -screen 0 1024x768x24'
          /tmp/hmg-test-venv/bin/python -m pytest -v tests
          --cov=converter --cov=output --cov=scoring --cov=ui
          --cov=hmg_plugin --cov=hmg_utils
          --cov-report=xml --cov-report=term"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          env_vars: OS,QGIS_IMAGE_TAG
          fail_ci_if_error: false
