name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu
      QGIS_IMAGE_TAG: 3.44.15
    steps:
      - uses: actions/checkout@v4

      - name: Pull QGIS 3.44.15 LTR
        run: docker pull qgis/qgis:${{ env.QGIS_IMAGE_TAG }}

      - name: Export requirements.txt
        run: |
          pip3 install poetry poetry-plugin-export
          poetry export --with dev --without pyqt5 --without-hashes -f requirements.txt -o requirements.txt

      - name: Run tests on QGIS 3.44.15
        run: >
          docker run --rm --volume `pwd`:/app -w=/app qgis/qgis:${{ env.QGIS_IMAGE_TAG }} sh -c
          "pip3 install -r requirements.txt && PYTHONPATH=/app xvfb-run -s '+extension GLX -screen 0 1024x768x24'
          pytest -v --cov --cov-report=xml --cov-report=term"

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          env_vars: OS,QGIS_IMAGE_TAG
          fail_ci_if_error: false
